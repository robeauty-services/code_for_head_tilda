<!-- Custom Code Growthbook Maksym -->
<script>
  window.growthbook_config = window.growthbook_config || {};
  window.growthbook_config.trackingCallback = function (experiment, result) {
    function getGaClientId() {
      var m = document.cookie.match(/_ga=GA1\.\d+\.(\d+\.\d+)/);
      if (m) return m[1];
      // no _ga yet — mint one in GA's format and save it so later events reuse it
      var cid =
        Math.floor(Math.random() * 2147483647) +
        "." +
        Math.floor(Date.now() / 1000);
      var domain = location.hostname.replace(/^www\./, "");
      document.cookie =
        "_ga=GA1.1." +
        cid +
        "; path=/; domain=." +
        domain +
        "; max-age=63072000";
      return cid;
    }
    return fetch(
      "https://payment-handler.site/fb_capi_service/api/google/experiment_viewed",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        keepalive: true,
        body: JSON.stringify({
          client_id: getGaClientId(),
          event_time: Math.floor(Date.now() / 1000),
          event_source_url: window.location.href,
          action_source: "website",
          events: [
            {
              name: "experiment_viewed",
              params: {
                experiment_id: experiment.key,
                variation_id: result.variationId,
                gbuuid: result.hashValue,
              },
            },
          ],
        }),
      },
    ).catch(function () {});
  };
</script>

<!-- Cart default CallOption switcher (config in Supabase, managed by sales dept admin page) -->
<script>
  (function () {
    var CFG_URL =
      "https://wyumatzrvdknhrulghuo.supabase.co/functions/v1/cart-config";

    function applyDefault(mode) {
      var tries = 0;
      (function tick() {
        var inputs = document.querySelectorAll(
          '.t706 input[type="radio"][name="CallOption"]'
        );
        if (!inputs.length) {
          if (++tries < 40) return setTimeout(tick, 250);
          return;
        }
        var target = null;
        Array.prototype.forEach.call(inputs, function (inp) {
          var v = (inp.value || "").toLowerCase();
          if (mode === "call_me" && v.indexOf("передзвон") !== -1) target = inp;
          if (mode === "no_call" && v.indexOf("без дзвінка") !== -1) target = inp;
        });
        if (!target) return;
        if (!target.checked) {
          target.checked = true;
          try {
            target.dispatchEvent(new Event("change", { bubbles: true }));
          } catch (e) {}
        }
        // переносимо дефолтний пункт на перше місце
        var label = target.closest ? target.closest("label") : null;
        var wrap = label && label.parentElement;
        if (wrap && wrap.firstElementChild !== label) {
          wrap.insertBefore(label, wrap.firstElementChild);
        }
      })();
    }

    function start() {
      fetch(CFG_URL, { cache: "no-store" })
        .then(function (r) {
          return r.json();
        })
        .then(function (d) {
          if (d && (d.value === "no_call" || d.value === "call_me")) {
            applyDefault(d.value);
          }
        })
        .catch(function () {});
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", start);
    } else {
      start();
    }
  })();
</script>
